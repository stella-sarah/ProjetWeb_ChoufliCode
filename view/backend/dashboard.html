<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuniFy - Dashboard</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .admin-container {
            display: flex;
            min-height: 100vh;
            background-color: #111;
        }
        
        .sidebar {
            width: 250px;
            background: var(--dark);
            padding: 2rem 1rem;
            border-right: 1px solid rgba(201, 168, 108, 0.2);
        }
        
        .sidebar-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .sidebar-logo img {
            width: 80px;
        }
        
        .nav-menu {
            list-style: none;
        }
        
        .nav-menu li {
            margin-bottom: 1rem;
        }
        
        .nav-menu a {
            color: var(--light);
            text-decoration: none;
            display: block;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: var(--transition);
        }
        
        .nav-menu a:hover, .nav-menu a.active {
            background: rgba(201, 168, 108, 0.2);
            color: var(--gold);
        }
        
        .main-content {
            flex: 1;
            padding: 2rem;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(201, 168, 108, 0.2);
        }
        
        .card {
            background: rgba(28, 28, 28, 0.7);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(201, 168, 108, 0.2);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(201, 168, 108, 0.2);
        }
        
        th {
            color: var(--gold);
        }
        
        .btn {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .btn-edit {
            background: #4CAF50;
            color: white;
        }
        
        .btn-delete {
            background: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../assets/logo.png" alt="TuniFy">
            </div>
            <ul class="nav-menu">
                <li><a href="#" class="active">Tableau de bord</a></li>
                <li><a href="#">Gestion des plats</a></li>
                <li><a href="#">Réservations</a></li>
                <li><a href="#">Commandes</a></li>
                <li><a href="#">Déconnexion</a></li>
            </ul>
        </aside>
        
        <main class="main-content">
            <div class="dashboard-header">
                <h1>Tableau de bord</h1>
                <p>Bienvenue, Admin</p>
            </div>
            
            <div class="card">
                <h2>Statistiques rapides</h2>
                <div class="stats">
                    <!-- Statistiques à ajouter -->
                </div>
            </div>
            
            <div class="card">
                <h2>Dernières réservations</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Client</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Jean Dupont</td>
                            <td>10/04/2023</td>
                            <td>
                                <button class="btn btn-edit">Modifier</button>
                                <button class="btn btn-delete">Supprimer</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    
    <script src="js/admin.js"></script>
</body>
</html>
